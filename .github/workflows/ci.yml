name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so typecheck/build pass without real Supabase keys.
      # Nothing here touches a real database.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      DATABASE_URL: postgresql://user:pass@localhost:5432/turfcut
      DIRECT_URL: postgresql://user:pass@localhost:5432/turfcut
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Generate the Prisma client explicitly so typecheck/build see the real
      # schema types, not the stub client.
      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  acceptance:
    # The data layer end to end on a real Postgres: fresh database from
    # prisma/supabase-manual-setup.sql + seed, then tests/acceptance/*.ts.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # No Supabase vars on purpose: the clients are lazy, and account
      # closure's auth-user delete then fails fast instead of calling out.
      PGURL: postgresql://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run db:generate
      - name: Acceptance checks
        run: npm run test:acceptance
